<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="page7.css">
    </head>
    <body>
        <div class="container">
            <div id="input-div">
                <h2>Metric/Imperial Unit Conversion</h2>
                <input type="text" id="input-el" placeholder="0">
                <button id="convert-btn">Convert</button>
            </div>
            <div id="results-div">
                <div class="card">
                    <h4>Length</h4>
                    <p id="length"> feet |  meters</p>
                </div>
                <div class="card">
                    <h4>Volume</h4>
                    <p id="volume">liters | gallons</p>
                </div>
                <div class="card">
                    <h4>Mass</h4>
                    <p id="mass"> kilograms | pounds</p>
                </div>
            </div>
        </div>
        <script src="page7.js"></script>
    </body>
</html>
